[package]
name = "zec-multisig"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Threshold custody for shielded Zcash funds: FROST over RedPallas, a distributed key ceremony, and the Orchard spends it authorises."
repository = "https://github.com/zyn-io/zec-multisig"
keywords = ["zcash", "frost", "threshold", "orchard", "custody"]
categories = ["cryptography::cryptocurrencies"]

# No cryptography is implemented here. Threshold signing fails silently and
# totally when it is got wrong, so this crate integrates the Zcash
# Foundation's audited `reddsa` FROST over RedPallas -- the scheme Orchard
# spend authorisation already uses -- and reimplements no part of it.
#
# What it does supply is everything between a signature and a transaction:
# the key ceremony, the wire protocol share-holders speak, note selection and
# witnesses, and the spend assembly. That gap is the work.
[dependencies]
# Wipes the buffers a share passes through on its way to and from disk.
zeroize = { version = "1", features = ["zeroize_derive"] }
reddsa = { version = "0.5", features = ["frost"] }
frost-rerandomized = "3"
frost-ed25519 = "3"
frost-core = "3"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand_core = "0.6"
rand = "0.8"
orchard = "0.15.5"
sapling-crypto = "0.7.0"
zcash_primitives = "0.30.1"
zcash_note_encryption = "0.4.2"
zcash_protocol = "0.10.5"
zcash_address = "0.13.0"
zcash_transparent = { version = "0.10.0", features = ["transparent-inputs"] }
zip32 = "0.2.1"
secp256k1 = "0.29.1"
bridgetree = "0.7.1"
incrementalmerkletree = "0.8"
sha2 = "0.10"
serde_json = "1"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
rand = "0.8"
